name: Release

# Push a tag like v1.2.3 and this builds a signed APK and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.SSOK_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.-' read -r MAJOR MINOR PATCH _ <<< "$VERSION"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          if [ "$CODE" -lt 1 ]; then CODE=1; fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, code $CODE"

      - name: Restore the signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SSOK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Warn when unsigned
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::No signing secrets set; the APK is signed with a throwaway debug key and cannot update a previous install."

      - name: Test and build
        env:
          SSOK_KEYSTORE_PASSWORD: ${{ secrets.SSOK_KEYSTORE_PASSWORD }}
          SSOK_KEY_ALIAS: ${{ secrets.SSOK_KEY_ALIAS }}
          SSOK_KEY_PASSWORD: ${{ secrets.SSOK_KEY_PASSWORD }}
        run: >
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ssokssok-${{ github.ref_name }}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: ssokssok ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
